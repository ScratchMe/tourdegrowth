# Private stats, readable by a Claude Code session, on a PUBLIC repository.
#
# The growth dashboard (`/admin/stats`) sits behind a password, and the
# Search Console needs a service account. Neither credential should enter a
# conversation, and — the trap this file exists to avoid — the logs and
# artifacts of a public repository's workflows are readable by ANYONE, so
# printing those numbers here in clear would undo the dashboard's password.
#
# So this workflow, MANUAL ONLY, reads both with secrets that stay in GitHub
# and prints the report ENCRYPTED to a one-run recipient: the session
# generates an `age` key pair, passes the public half as the `recipient`
# input, reads the log through the GitHub API, and decrypts with the private
# half it never stored anywhere (`scripts/stats-decrypt.sh`). Same rules as
# `verify-live.yml`: `workflow_dispatch` only (never `pull_request`, never
# `pull_request_target`), `contents: read`, actions pinned by commit.
#
# Secrets it reads (both optional — a missing one skips its half):
#   ADMIN_DASHBOARD_PASSWORD  the same value as in Vercel
#   GSC_SERVICE_ACCOUNT_JSON  a Google service-account key, added as a
#                             RESTRICTED user of the Search Console property
# Optional repository variable: GSC_SITE (a property name), when the property
# is not the one containing "tourdegrowth" — see scripts/gsc-report.mjs.
name: Pull private stats (encrypted)

on:
  workflow_dispatch:
    inputs:
      recipient:
        description: age public key to encrypt the report to (age1…, generated by the session for this run)
        type: string
        required: true
      scope:
        description: What to pull
        type: choice
        default: both
        options:
          - admin
          - gsc
          - both
      site:
        description: Site to read the dashboard from
        type: string
        default: https://www.tourdegrowth.com

permissions:
  contents: read

jobs:
  pull:
    name: Encrypted report
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Pinned by commit, like verify-live.yml: this workflow holds secrets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Refuse anything that is not an age public key
        env:
          RECIPIENT: ${{ inputs.recipient }}
        run: |
          if ! printf '%s' "$RECIPIENT" | grep -Eq '^age1[0-9a-z]{58}$'; then
            echo "recipient must be an age public key (age1 + 58 chars)"; exit 1
          fi

      - name: Install age (pinned release, checksum verified)
        run: |
          curl -fsSL -o age.tgz https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz
          echo "7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50  age.tgz" | sha256sum -c -
          tar xzf age.tgz
          echo "$PWD/age" >> "$GITHUB_PATH"
          mkdir -p report

      - name: Growth dashboard (/admin/stats/json)
        if: inputs.scope != 'gsc'
        env:
          ADMIN_DASHBOARD_PASSWORD: ${{ secrets.ADMIN_DASHBOARD_PASSWORD }}
          SITE: ${{ inputs.site }}
        run: |
          if [ -z "$ADMIN_DASHBOARD_PASSWORD" ]; then
            echo "ADMIN_DASHBOARD_PASSWORD is not set — skipping the dashboard"; exit 0
          fi
          # -u ":password": the proxy ignores the user name (one shared secret).
          # The response goes to a file only; nothing of it is ever echoed.
          curl -fsS -u ":$ADMIN_DASHBOARD_PASSWORD" "$SITE/admin/stats/json" -o report/admin.json
          echo "dashboard: $(wc -c < report/admin.json) bytes"

      - name: Search Console (service account, read-only)
        if: ${{ !cancelled() && inputs.scope != 'admin' }}
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE: ${{ vars.GSC_SITE }}
        run: |
          if [ -z "$GSC_SERVICE_ACCOUNT_JSON" ]; then
            echo "GSC_SERVICE_ACCOUNT_JSON is not set — skipping Search Console"; exit 0
          fi
          node scripts/gsc-report.mjs > report/gsc.json
          echo "search console: $(wc -c < report/gsc.json) bytes"

      - name: Encrypt to the run's recipient and print
        if: ${{ !cancelled() }}
        env:
          RECIPIENT: ${{ inputs.recipient }}
        run: |
          if [ -z "$(ls -A report)" ]; then echo "nothing to report"; exit 1; fi
          tar czf report.tgz -C report .
          # Only the ciphertext reaches the log. `-a` is ASCII armor, which
          # is what survives a copy out of the GitHub API's log text.
          age -r "$RECIPIENT" -a -o report.age report.tgz
          echo "files: $(ls report | tr '\n' ' ')"
          cat report.age
