# REVIEW.md R-05 — the repo had no CI at all: 19 PRs were merged without a
# single automated check, while Vitest and tsc only ever ran when someone
# remembered to. Vercel builds every push, but a build passing says nothing
# about the tests.
#
# One job, not several: a side project pays for `npm ci` once, and the steps
# below are ordered cheapest-first so a broken type or a failing test reports
# in seconds rather than after a full Next.js build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keeps the first-run telemetry notice out of the logs.
  NEXT_TELEMETRY_DISABLED: "1"
  # A fake site code, so the GoatCounter script TAG is rendered and the E2E
  # fixture can replace it with a local stub (REVIEW.md R-11). Without it
  # `trackEvent` no-ops and every analytics assertion passes while proving
  # nothing. Nothing is ever sent anywhere: the fixture intercepts the
  # script request, so no spec reaches gc.zgo.at or this made-up site.
  NEXT_PUBLIC_GOATCOUNTER_CODE: "e2e-stub"
  # `/admin/*` is behind Basic Auth in proxy.ts and FAILS CLOSED: with no
  # password set, every admin request is a 401 for everyone. The audit
  # instrument lives there, so its specs need a password the test browser can
  # send. A made-up value — nothing real is behind it in CI, and the real one
  # lives only in Vercel.
  ADMIN_DASHBOARD_PASSWORD: "e2e-admin"
  # The game (GAME-BRIEF.md 13.6): CI builds and tests it OPEN, so the
  # footer link, the sitemap entries and the game pages are all exercised
  # end to end. The closed state is covered where it can be pinned exactly —
  # the unit tests of the resolver, the proxy and the build flag — the same
  # split the /admin gate uses.
  GAME_ENABLED: "true"

jobs:
  check:
    name: Types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Matches the Node major Vercel runs this project on.
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      # `--coverage` enforces the floor set in vitest.config.ts (REVIEW-02.md
      # R2-10): a module nobody imports from a test now fails the run instead
      # of silently not counting.
      - name: Unit tests
        run: npx vitest run --coverage

      # No secrets needed: every route that touches Firestore or Gemini is
      # rendered on demand, so nothing calls them at build time.
      - name: Build
        run: npm run build

      # REVIEW.md R-07. The specs run against `next start`, so they need the
      # build above; Playwright's own webServer starts it.
      - name: Install Playwright browser
        # `--with-deps` runs `apt-get update` over EVERY apt source baked into
        # the runner image, including Google's Chrome repository, which this
        # job never installs from (Playwright downloads its own Chromium). On
        # 2026-09-09 that repository served an index whose hash did not match
        # its Release file for a good half hour, and two CI runs died there
        # before a single test ran. Dropping the source first keeps the job's
        # only apt dependency the Ubuntu archive itself.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
