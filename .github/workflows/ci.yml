# REVIEW.md R-05 — the repo had no CI at all: 19 PRs were merged without a
# single automated check, while Vitest and tsc only ever ran when someone
# remembered to. Vercel builds every push, but a build passing says nothing
# about the tests.
#
# One job, not several: a side project pays for `npm ci` once, and the steps
# below are ordered cheapest-first so a broken type or a failing test reports
# in seconds rather than after a full Next.js build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keeps the first-run telemetry notice out of the logs.
  NEXT_TELEMETRY_DISABLED: "1"
  # A fake site code, so the GoatCounter script TAG is rendered and the E2E
  # fixture can replace it with a local stub (REVIEW.md R-11). Without it
  # `trackEvent` no-ops and every analytics assertion passes while proving
  # nothing. Nothing is ever sent anywhere: the fixture intercepts the
  # script request, so no spec reaches gc.zgo.at or this made-up site.
  NEXT_PUBLIC_GOATCOUNTER_CODE: "e2e-stub"

jobs:
  check:
    name: Types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the Node major Vercel runs this project on.
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      # `--coverage` enforces the floor set in vitest.config.ts (REVIEW-02.md
      # R2-10): a module nobody imports from a test now fails the run instead
      # of silently not counting.
      - name: Unit tests
        run: npx vitest run --coverage

      # No secrets needed: every route that touches Firestore or Gemini is
      # rendered on demand, so nothing calls them at build time.
      - name: Build
        run: npm run build

      # REVIEW.md R-07. The specs run against `next start`, so they need the
      # build above; Playwright's own webServer starts it.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
