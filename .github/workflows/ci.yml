# REVIEW.md R-05 — the repo had no CI at all: 19 PRs were merged without a
# single automated check, while Vitest and tsc only ever ran when someone
# remembered to. Vercel builds every push, but a build passing says nothing
# about the tests.
#
# One job, not several: a side project pays for `npm ci` once, and the steps
# below are ordered cheapest-first so a broken type or a failing test reports
# in seconds rather than after a full Next.js build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keeps the first-run telemetry notice out of the logs.
  NEXT_TELEMETRY_DISABLED: "1"
  # A fake site code, so the GoatCounter script TAG is rendered and the E2E
  # fixture can replace it with a local stub (REVIEW.md R-11). Without it
  # `trackEvent` no-ops and every analytics assertion passes while proving
  # nothing. Nothing is ever sent anywhere: the fixture intercepts the
  # script request, so no spec reaches gc.zgo.at or this made-up site.
  NEXT_PUBLIC_GOATCOUNTER_CODE: "e2e-stub"
  # `/admin/*` is behind Basic Auth in proxy.ts and FAILS CLOSED: with no
  # password set, every admin request is a 401 for everyone. The audit
  # instrument lives there, so its specs need a password the test browser can
  # send. A made-up value — nothing real is behind it in CI, and the real one
  # lives only in Vercel.
  ADMIN_DASHBOARD_PASSWORD: "e2e-admin"
  # The game (GAME-BRIEF.md 13.6): CI builds and tests it OPEN, so the
  # footer link, the sitemap entries and the game pages are all exercised
  # end to end. The closed state is covered where it can be pinned exactly —
  # the unit tests of the resolver, the proxy and the build flag — the same
  # split the /admin gate uses.
  GAME_ENABLED: "true"

jobs:
  check:
    name: Types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Matches the Node major Vercel runs this project on.
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      # scripts/installer-un-plugin.mjs opens plug-in archives with `unzip`, and
      # its test builds them with `zip` and `python3`. The runner image ships
      # all three; naming them here turns a future image change into a failed
      # step that says what is missing, instead of a dozen tests that don't.
      - name: Archive tools
        # One name at a time: `command -v a b c` exits 0 as soon as one is found.
        run: for tool in unzip zip python3; do command -v "$tool" || { echo "::error::$tool is missing"; exit 1; }; done

      # `--coverage` enforces the floor set in vitest.config.ts (REVIEW-02.md
      # R2-10): a module nobody imports from a test now fails the run instead
      # of silently not counting.
      - name: Unit tests
        run: npx vitest run --coverage

      # No secrets needed: every route that touches Firestore or Gemini is
      # rendered on demand, so nothing calls them at build time.
      - name: Build
        run: npm run build

      # REVIEW.md R-07. The specs run against `next start`, so they need the
      # build above; Playwright's own webServer starts it.
      - name: Install Playwright browser
        # `--with-deps` runs `apt-get update` over EVERY apt source baked into
        # the runner image, including Google's Chrome repository, which this
        # job never installs from (Playwright downloads its own Chromium). On
        # 2026-09-09 that repository served an index whose hash did not match
        # its Release file for a good half hour, and two CI runs died there
        # before a single test ran. Dropping the source first keeps the job's
        # only apt dependency the Ubuntu archive itself.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          npx playwright install --with-deps chromium

      # CHANTIERS.md A7.11 (C17): a real `/r/<id>`, read from the Firestore
      # EMULATOR, so the stored document, its narrowing and what crosses to
      # the client are tested end to end with no test door in the production
      # code (`e2e/real-results.ts`). The emulator is the jar the Firebase CLI
      # would fetch, downloaded directly and checked against its SHA-256
      # (GITHUB.md §1.5), run on the image's JDK 21: no npm dependency, no
      # container. The credentials are made up for this job: a `demo-`
      # project, which the emulator treats as offline, and an RSA key
      # generated here — `cert()` wants a well-formed key, and the emulator
      # never checks it. Nothing it could open exists, and still it is kept
      # out of the public log: `$GITHUB_ENV` values are printed at the top of
      # every later step, so only the three plain values go there, and the
      # key waits in a file only the end-to-end step reads.
      - name: Firestore emulator
        env:
          EMULATOR_VERSION: "1.22.0"
          EMULATOR_SHA256: "9b6498b7f62714d67f48f59b3818883cd682dbcd46b9f59511de81c97bb5166c"
        run: |
          java="${JAVA_HOME_21_X64:-}/bin/java"
          [ -x "$java" ] || { echo "::error::JDK 21 is missing from the runner image (JAVA_HOME_21_X64)"; exit 1; }
          jar="$RUNNER_TEMP/cloud-firestore-emulator-v$EMULATOR_VERSION.jar"
          curl -fsSL --retry 3 -o "$jar" "https://storage.googleapis.com/firebase-preview-drop/emulator/cloud-firestore-emulator-v$EMULATOR_VERSION.jar"
          echo "$EMULATOR_SHA256  $jar" | sha256sum -c -
          nohup "$java" -jar "$jar" --host=127.0.0.1 --port=8080 > "$RUNNER_TEMP/firestore-emulator.log" 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:8080/ > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/ > /dev/null || { cat "$RUNNER_TEMP/firestore-emulator.log"; exit 1; }
          (umask 077 && openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/throwaway-key.pem" 2> /dev/null)
          {
            echo "FIRESTORE_EMULATOR_HOST=127.0.0.1:8080"
            echo "FIREBASE_PROJECT_ID=demo-tdg-e2e"
            echo "FIREBASE_CLIENT_EMAIL=e2e@demo-tdg-e2e.iam.gserviceaccount.com"
          } >> "$GITHUB_ENV"

      - name: End-to-end tests
        # The throwaway key from the emulator step, read here only (see there).
        run: |
          key="$(cat "$RUNNER_TEMP/throwaway-key.pem")"
          FIREBASE_PRIVATE_KEY="$key" npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
