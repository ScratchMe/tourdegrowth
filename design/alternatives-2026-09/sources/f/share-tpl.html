<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; font-family: "Bricolage Grotesque", sans-serif; color: #f5f3ee;
    background-color: #1b1030;
    background-image: GRID(#b4a9d3, 0.16), radial-gradient(700px 420px at 92% 0%, rgba(63, 208, 255, 0.16), transparent 70%), radial-gradient(700px 500px at 0% 100%, rgba(255, 62, 154, 0.10), transparent 70%);
    background-size: 24px 24px, auto, auto;
  }
  svg { display: block; }
  .hud { position: absolute; left: 56px; right: 56px; top: 38px; height: 40px; display: flex; align-items: center; justify-content: space-between; }
  .mark { display: flex; align-items: center; gap: 16px; }
  .wm { font: 700 30px/1 "Pixelify Sans"; letter-spacing: .02em; }
  .wm b { color: #3fd0ff; font-weight: 700; }
  .world { display: flex; height: 34px; font: 700 13px/1 "JetBrains Mono"; letter-spacing: .1em; color: #1b1030; }
  .world .ic { width: 34px; display: grid; place-items: center; background: #0e0820; color: #3fd0ff; border: 3px solid transparent; border-image: FRAME(#3fd0ff) 3 / 3px stretch; background-clip: padding-box; }
  .world .ic svg { width: 16px; height: 16px; }
  .world .t { display: flex; align-items: center; padding: 0 12px 0 10px; margin-left: -3px; background: #3fd0ff; border: 3px solid transparent; border-image: FRAME(#3fd0ff) 3 / 3px stretch; background-clip: padding-box; }
  .kicker { font: 700 15px/1 "JetBrains Mono"; letter-spacing: .12em; color: #b4a9d3; padding: 9px 14px; border: 3px solid transparent; border-image: FRAME(#6b5a9e) 3 / 3px stretch; }
  .floor { position: absolute; left: 0; right: 0; top: 96px; height: 12px; background: #3fd0ff; -webkit-mask: ICON(dither) 0 0 / 8px 12px repeat-x; mask: ICON(dither) 0 0 / 8px 12px repeat-x; }
  .score { position: absolute; left: 56px; top: 138px; width: 548px; }
  .label { font: 700 15px/1 "JetBrains Mono"; letter-spacing: .14em; color: #b4a9d3; }
  .num { display: flex; align-items: flex-end; gap: 16px; margin-top: 18px; }
  .pv { display: flex; flex-direction: column; align-items: center; gap: 8px; padding-bottom: 14px; font: 700 26px/1 "Pixelify Sans"; }
  .pv svg { width: 32px; height: 28px; color: #ff3e9a; }
  .n { font: 800 150px/.8 "JetBrains Mono"; letter-spacing: -.06em; font-variant-numeric: tabular-nums; }
  .of { font: 700 38px/1 "JetBrains Mono"; color: #b4a9d3; padding-bottom: 4px; letter-spacing: -.02em; }
  .hp { margin-top: 24px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; padding: 6px; background: #0e0820; border: 3px solid transparent; border-image: FRAME(#6b5a9e) 3 / 3px stretch; background-clip: padding-box; }
  .g { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; height: 20px; }
  .g i { background: #3b2c66; }
  .g i.on { background: #f5f3ee; box-shadow: inset 0 -4px 0 rgba(27,16,48,.22); }
  .g.boss i.on { background: #ff3e9a; }
  .lv { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; padding: 9px 9px 0; font: 700 13px/1 "JetBrains Mono"; color: #b4a9d3; }
  .lv span { display: flex; align-items: center; gap: 6px; }
  .lv .boss { color: #ff6fb2; }
  .lv svg { width: 13px; height: 13px; }
  .head { position: absolute; left: 660px; right: 56px; top: 172px; }
  .h1 { font: 800 44px/1.1 "Bricolage Grotesque"; letter-spacing: -.02em; }
  .h1 em { font-style: normal; color: #ff3e9a; }
  .h2 { margin-top: 18px; font: 700 42px/1 "Pixelify Sans"; color: #ffd84d; text-shadow: 3px 3px 0 #0e0820; }
  .box { position: absolute; left: 56px; right: 56px; bottom: 40px; height: 196px; background: #241641; border: 4px solid transparent; border-image: FRAME(#ffd84d) 3 / 4px stretch; background-clip: padding-box; box-shadow: inset 0 0 0 4px #241641, inset 0 0 0 6px rgba(255, 216, 77, .35), 10px 10px 0 #0e0820; padding: 26px 34px 0; }
  .eb { display: flex; align-items: center; gap: 14px; font: 700 15px/1 "JetBrains Mono"; letter-spacing: .12em; color: #ffd84d; }
  .q { display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 8px; background: #ffd84d; color: #1b1030; font-size: 14px; border: 3px solid transparent; border-image: FRAME(#ffd84d) 3 / 3px stretch; background-clip: padding-box; }
  .q svg { width: 14px; height: 14px; }
  .eb .st { margin-left: auto; color: #ff6fb2; }
  .body { margin-top: 18px; font: 600 29px/1.35 "Bricolage Grotesque"; letter-spacing: -.01em; max-width: 1000px; }
  .url { position: absolute; right: 30px; bottom: 18px; display: flex; align-items: center; gap: 10px; font: 700 17px/1 "JetBrains Mono"; color: #ffd84d; letter-spacing: .02em; }
  .url svg { width: 16px; height: 9px; }
</style>
</head>
<body>
  <div class="hud">
    <div class="mark"><div class="wm">TOUR DE <b>GROWTH</b></div><div class="world"><span class="ic">[[flag]]</span><span class="t">{{world}}</span></div></div>
    <div class="kicker">{{kicker}}</div>
  </div>
  <div class="floor"></div>
  <div class="score">
    <div class="label">{{scoreLabel}}</div>
    <div class="num"><div class="pv">[[heart]]<span>{{pv}}</span></div><div class="n">74</div><div class="of">/100</div></div>
    <div class="hp">
      <div class="g"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div>
      <div class="g"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i></div>
      <div class="g boss"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="g"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></div>
      <div class="g"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div>
    </div>
    <div class="lv"><span>1-1</span><span>1-2</span><span class="boss">[[skull]]1-3 {{boss}}</span><span>1-4</span><span>1-5</span></div>
  </div>
  <div class="head">
    <div class="h1"><em>{{h1a}}</em>{{h1b}}</div>
    <div class="h2">{{h2}}</div>
  </div>
  <div class="box">
    <div class="eb"><span class="q">[[quest]]{{quest}}</span><span>{{moveLabel}}</span><span class="st">{{stage}}</span></div>
    <div class="body">{{move}}</div>
    <div class="url">tourdegrowth.com [[down]]</div>
  </div>
</body>
</html>
