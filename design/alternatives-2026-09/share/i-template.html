<!doctype html><html lang="{{lang}}"><head><meta charset="utf-8"><link rel="stylesheet" href="/fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:630px;overflow:hidden;background:#ebe5d7;color:#1d1812;font-family:Inter,sans-serif;position:relative}
body::before{content:"";position:absolute;inset:0;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .12  0 0 0 0 .1  0 0 0 0 .07  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}
.wrap{position:absolute;inset:0;padding:40px 56px 38px;display:grid;grid-template-rows:auto 1fr auto;}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:18px;font:700 30px/1 "Stardos Stencil"}
.brand b{color:#d2402c;font-weight:700}
.bib{display:inline-flex;align-items:baseline;gap:8px;padding:8px 14px 7px;border:2px solid #1d1812;border-radius:7px;background:radial-gradient(circle at 10px 8px,#1d1812 0 2.2px,transparent 2.7px),radial-gradient(circle at calc(100% - 10px) 8px,#1d1812 0 2.2px,transparent 2.7px),#fcfaf4;transform:rotate(-2deg);box-shadow:3px 3px 0 #1d1812}
.bib i{font:700 20px/1 "IBM Plex Mono";color:#a32e1f;font-style:normal}
.bib span{font:600 12px/1 "IBM Plex Mono";letter-spacing:.14em;text-transform:uppercase}
.badge{font:600 15px/1 "IBM Plex Mono";letter-spacing:.12em;text-transform:uppercase;padding:11px 18px;border:2px solid #1d1812;border-radius:999px;background:#fcfaf4}
.mid{display:grid;grid-template-columns:450px 1fr;gap:48px;align-items:center}
.eyebrow{font:600 15px/1 "IBM Plex Mono";letter-spacing:.16em;text-transform:uppercase;color:#564e41}
.score{display:flex;align-items:flex-end;gap:10px;margin-top:10px}
.score strong{font:700 232px/.8 "Stardos Stencil";letter-spacing:-.02em}
.score em{font:700 60px/1 "Stardos Stencil";color:#564e41;font-style:normal;margin-bottom:8px}
.rail{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:24px}
.rail div{font:600 11.5px/1 "IBM Plex Mono";letter-spacing:.06em;text-transform:uppercase;color:#564e41}
.rail div::before{content:"";display:block;height:8px;border-radius:8px;margin-bottom:8px;background:linear-gradient(90deg,#1d1812 var(--p),rgba(29,24,18,.15) var(--p))}
.rail .w{color:#a32e1f}
.rail .w::before{background:linear-gradient(90deg,#d2402c var(--p),rgba(210,64,44,.2) var(--p))}
.move{background:#fcfaf4;border:2px dashed #d2402c;border-radius:18px;padding:28px 32px 30px;box-shadow:7px 7px 0 #d2402c}
.move .row{display:flex;justify-content:space-between;font:600 15px/1 "IBM Plex Mono";letter-spacing:.12em;text-transform:uppercase}
.move .row b{color:#a32e1f}
.move p{font:700 30px/1.25 Inter;letter-spacing:-.015em;margin-top:18px}
.bottom{display:flex;align-items:flex-end;justify-content:space-between}
.bottom p{font:700 29px/1.25 Inter;letter-spacing:-.01em}
.bottom p span{display:block;color:#564e41;font-weight:600}
.url{font:600 19px/1 "IBM Plex Mono";background:#cc3e2b;color:#fcfaf4;padding:14px 20px;border-radius:12px;border:2px solid #1d1812;box-shadow:4px 4px 0 #1d1812}
</style></head><body><div class="wrap">
<div class="top"><div class="brand">TOUR DE <b>GROWTH</b><span class="bib"><i>№&nbsp;1</i><span>{{bib}}</span></span></div><div class="badge">{{badge}}</div></div>
<div class="mid"><div><div class="eyebrow">{{eyebrow}}</div><div class="score"><strong>74</strong><em>/100</em></div>
<div class="rail"><div style="--p:90%">Acq.</div><div style="--p:60%">Act.</div><div class="w" style="--p:40%">Ret.</div><div style="--p:80%">Ref.</div><div style="--p:100%">Rev.</div></div></div>
<div class="move"><div class="row"><b>{{next}}</b><span>Retention · 8/20</span></div><p>{{move}}</p></div></div>
<div class="bottom"><p>{{tag1}}<span>{{tag2}}</span></p><div class="url">tourdegrowth.com</div></div>
</div></body></html>
